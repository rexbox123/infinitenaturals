# Infinite Naturals — Docker Compose
#
#   Development:   docker compose --profile dev up -d --build          (+ Mailpit inbox at http://localhost:8025)
#   Stripe test:   docker compose --profile dev --profile stripe up -d  (forwards Stripe test webhooks)
#   Production:    docker compose --profile https up -d --build         (+ Caddy with automatic HTTPS)
#
# All configuration comes from the .env file next to this file (start from .env.docker.example).

x-app: &app
  build:
    context: .
  image: infinitenaturals-app:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage-app:/var/www/html/storage/app
    - storage-logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      # On start: migrate the database, link storage, cache config/routes/views.
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--backoff=10", "--max-time=3600"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-infinitenaturals}
      MYSQL_USER: ${DB_USERNAME:-infinitenaturals}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Bound to localhost only, for database tools on the host.
      - "127.0.0.1:${DB_FORWARD_PORT:-33060}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- development helpers ---------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  stripe:
    image: stripe/stripe-cli:v1.30.0
    profiles: ["stripe"]
    command:
      - listen
      - --forward-to
      - http://app:8080/webhooks/stripe
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,charge.refunded
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET:-}
    depends_on:
      - app

  # --- production HTTPS --------------------------------------------------------
  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mysql-data:
  storage-app:
  storage-logs:
  caddy-data:
  caddy-config:
